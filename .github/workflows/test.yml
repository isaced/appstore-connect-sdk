name: Test 

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - run: npm ci
      - run: npm run build
      - run: bun test ./test
      - name: Publish artifact smoke test
        run: node scripts/smoke-test.mjs 