name: Test 

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - run: npm ci
      - name: Generated code freshness (committed spec + rules → src/openapi)
        run: |
          sh gen-openapi.sh
          git diff --exit-code src/openapi || {
            echo "::error::src/openapi does not match the committed spec + patch rules. Run 'sh gen-openapi.sh' and commit the result."
            exit 1
          }
      - run: npm run build
      - run: bun test ./test
      - name: Typecheck (incl. pagination inference tests)
        run: bun check -p tsconfig.typecheck.json
      - name: Publish artifact smoke test
        run: node scripts/smoke-test.mjs 