# Publishes the package to npmjs (OIDC trusted publishing) when a version tag is pushed.

name: Publish 

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Verify tag matches package version
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Publish must run from a version tag (got ref ${{ github.ref }}). Push a tag such as v2.5.0, or re-run this workflow from that tag."
            exit 1
          fi
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json version $PKG_VERSION."
            exit 1
          fi
          echo "Publishing $PKG_VERSION from tag ${{ github.ref_name }}."
      - run: npm ci
      - run: npm run build
      - name: Smoke test packed artifact
        run: node scripts/smoke-test.mjs
      - run: npm publish
