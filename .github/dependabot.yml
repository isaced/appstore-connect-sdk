version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      production:
        patterns:
          - "jose"
          - "zod"
      dev-tooling:
        patterns:
          - "@hey-api/*"
          - "typescript"
          - "esbuild"
          - "@types/*"
          - "standard-version"

  - package-ecosystem: npm
    directory: "/node_example/"
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
